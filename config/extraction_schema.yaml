# ==============================================================================
# SIH 2026: SCHEMA-DRIVEN FIELD EXTRACTION SPECIFICATION
# Used by agent/tools/field_extractor.py to dynamically parse any user report
# ==============================================================================

fields:
  equipment_tag:
    synonyms:
      - "EQUIPMENT"
      - "EQUIPMENT TAG"
      - "EQUIPMENT TAG NO"
      - "EQUIPMENT TAG NO."
      - "TAG NO"
      - "TAG NO."
      - "TAG NUMBER"
      - "ASSET ID"
      - "ASSET NO"
      - "ITEM NO"
      - "VESSEL TAG"
      - "VESSEL NO"
    pattern: "([A-Z]{1,4}[- ]?[0-9]{2,5}[A-Z]?)"
    required: true

  equipment_name:
    synonyms:
      - "EQUIPMENT NAME"
      - "EQUIPMENT DESCRIPTION"
      - "ASSET NAME"
      - "VESSEL NAME"
      - "SERVICE"
      - "DESCRIPTION"
    pattern: "([A-Za-z0-9\\s\\-_/]{3,50})"
    required: false

  plant_unit:
    synonyms:
      - "UNIT"
      - "PLANT"
      - "PLANT UNIT"
      - "LOCATION"
      - "AREA"
      - "SECTION"
    pattern: "([A-Za-z0-9\\s\\-_/()]{2,40})"
    required: false

  inspection_date:
    synonyms:
      - "DATE"
      - "INSPECTION DATE"
      - "SURVEY DATE"
      - "REPORT DATE"
      - "EXAM DATE"
    pattern: "([0-9]{1,2}[-/][0-9]{1,2}[-/][0-9]{2,4}|[0-9]{1,2}[- ][A-Za-z]{3,9}[- ][0-9]{2,4})"
    required: false

  previous_inspection_date:
    synonyms:
      - "PREVIOUS DATE"
      - "PREV DATE"
      - "LAST INSPECTION DATE"
      - "PRIOR DATE"
      - "BASE DATE"
    pattern: "([0-9]{1,2}[-/][0-9]{1,2}[-/][0-9]{2,4}|[0-9]{1,2}[- ][A-Za-z]{3,9}[- ][0-9]{2,4}|[0-9]{4})"
    required: false

  inspector:
    synonyms:
      - "LEAD INSPECTOR"
      - "INSPECTED BY"
      - "INSPECTOR"
      - "SURVEYOR"
      - "EXAMINER"
      - "ENGINEER"
    pattern: "([A-Za-z\\.\\s]+(?:\\(Emp\\s*#[0-9]+\\)|Emp\\s*ID:\\s*[0-9]+)?)"
    required: false

  ndt_method:
    synonyms:
      - "NDT"
      - "NDT METHOD"
      - "METHOD"
      - "TECHNIQUE"
      - "EXAMINATION METHOD"
    pattern: "([A-Za-z0-9\\s&/\\-_]{2,30})"
    required: false

  nominal_thickness:
    synonyms:
      - "NOMINAL THICKNESS"
      - "NOMINAL THK"
      - "NOM THK"
      - "T_NOM"
      - "ORIGINAL THICKNESS"
    pattern: "([0-9]+(?:\\.[0-9]+)?)"
    default_unit: "mm"
    required: false

  previous_thickness:
    synonyms:
      - "PREVIOUS THICKNESS"
      - "PREV THICKNESS"
      - "PREVIOUS THK"
      - "PREV THK"
      - "T_PREV"
      - "PRIOR THICKNESS"
      - "LAST THICKNESS"
      - "2022 THICKNESS"
      - "BASE THICKNESS"
    pattern: "([0-9]+(?:\\.[0-9]+)?)"
    default_unit: "mm"
    required: true

  measured_thickness:
    synonyms:
      - "MEASURED THICKNESS"
      - "ACTUAL THICKNESS"
      - "CURRENT THICKNESS"
      - "MEASURED THK"
      - "ACTUAL THK"
      - "T_ACT"
      - "T_MEAS"
      - "THK (MM)"
      - "THICKNESS (MM)"
      - "2026 THICKNESS"
      - "READING"
    pattern: "([0-9]+(?:\\.[0-9]+)?)"
    default_unit: "mm"
    required: true

  design_minimum:
    synonyms:
      - "DESIGN MINIMUM"
      - "MIN REQUIRED"
      - "MINIMUM REQUIRED"
      - "MIN REQ"
      - "MINIMUM THICKNESS"
      - "MIN THK"
      - "T_MIN"
      - "T_REQ"
      - "RETIREMENT THICKNESS"
    pattern: "([0-9]+(?:\\.[0-9]+)?)"
    default_unit: "mm"
    required: true

  inspection_interval_years:
    synonyms:
      - "INTERVAL"
      - "TIME INTERVAL"
      - "INSPECTION INTERVAL"
      - "DELTA T"
      - "PERIOD"
      - "DURATION (YEARS)"
      - "YEARS ELAPSED"
    pattern: "([0-9]+(?:\\.[0-9]+)?)"
    default_unit: "years"
    required: false

units:
  thickness:
    mm: 1.0
    inch: 25.4
    in: 25.4
    mils: 0.0254
    mil: 0.0254
