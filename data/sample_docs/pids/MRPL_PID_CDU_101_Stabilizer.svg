<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <!-- Background -->
  <rect width="1200" height="800" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  
  <!-- Title Block -->
  <rect x="850" y="700" width="330" height="80" fill="#f8f9fa" stroke="#000000" stroke-width="1.5"/>
  <text x="860" y="720" font-family="Arial" font-size="14" font-weight="bold" fill="#000000">MRPL - MANGALORE REFINERY</text>
  <text x="860" y="740" font-family="Arial" font-size="12" fill="#333333">UNIT 101: NAPHTHA STABILIZER P&amp;ID</text>
  <text x="860" y="760" font-family="Arial" font-size="11" fill="#666666">DWG NO: MRPL-PID-CDU-101-REV4</text>
  
  <!-- Process Piping Lines -->
  <!-- Feed Line -->
  <line x1="50" y1="350" x2="350" y2="350" stroke="#003366" stroke-width="4"/>
  <text x="80" y="340" font-family="Arial" font-size="12" font-weight="bold" fill="#003366">LINE-01-HC-101 (FEED INLET 45 T/h)</text>
  
  <!-- Control Valve on Feed (FCV-101) -->
  <polygon points="220,340 220,360 260,340 260,360" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <line x1="240" y1="350" x2="240" y2="310" stroke="#000000" stroke-width="1.5"/>
  <circle cx="240" cy="290" r="20" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="225" y="295" font-family="Arial" font-size="11" font-weight="bold" fill="#000000">FCV</text>
  <text x="225" y="265" font-family="Arial" font-size="10" fill="#000000">TAG: 101</text>
  
  <!-- Column C-101 -->
  <rect x="350" y="150" width="120" height="450" rx="60" ry="30" fill="#e9ecef" stroke="#000000" stroke-width="3"/>
  <text x="380" y="370" font-family="Arial" font-size="16" font-weight="bold" fill="#000000">C-101</text>
  <text x="365" y="395" font-family="Arial" font-size="12" fill="#333333">STABILIZER</text>
  
  <!-- Trays inside column -->
  <line x1="360" y1="250" x2="460" y2="250" stroke="#6c757d" stroke-dasharray="4,4" stroke-width="1.5"/>
  <line x1="360" y1="300" x2="460" y2="300" stroke="#6c757d" stroke-dasharray="4,4" stroke-width="1.5"/>
  <line x1="360" y1="450" x2="460" y2="450" stroke="#6c757d" stroke-dasharray="4,4" stroke-width="1.5"/>
  <line x1="360" y1="500" x2="460" y2="500" stroke="#6c757d" stroke-dasharray="4,4" stroke-width="1.5"/>
  
  <!-- Overhead Vapor Line -->
  <line x1="410" y1="150" x2="410" y2="80" stroke="#003366" stroke-width="4"/>
  <line x1="410" y1="80" x2="650" y2="80" stroke="#003366" stroke-width="4"/>
  
  <!-- Condenser E-101 -->
  <rect x="650" y="50" width="100" height="60" rx="10" fill="#d1e7dd" stroke="#000000" stroke-width="2"/>
  <text x="675" y="85" font-family="Arial" font-size="13" font-weight="bold" fill="#000000">E-101</text>
  <text x="660" y="100" font-family="Arial" font-size="10" fill="#000000">CONDENSER</text>
  
  <!-- Overhead Line into Reflux Drum V-101 -->
  <line x1="750" y1="80" x2="820" y2="80" stroke="#003366" stroke-width="4"/>
  <line x1="820" y1="80" x2="820" y2="160" stroke="#003366" stroke-width="4"/>
  
  <!-- Reflux Drum V-101 -->
  <rect x="760" y="160" width="120" height="80" rx="20" fill="#fff3cd" stroke="#000000" stroke-width="2.5"/>
  <text x="795" y="200" font-family="Arial" font-size="14" font-weight="bold" fill="#000000">V-101</text>
  <text x="775" y="220" font-family="Arial" font-size="11" fill="#333333">REFLUX DRUM</text>
  
  <!-- Level Transmitter LT-101 on V-101 -->
  <circle cx="920" cy="200" r="18" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="910" y="205" font-family="Arial" font-size="11" font-weight="bold" fill="#000000">LT</text>
  <text x="905" y="230" font-family="Arial" font-size="10" fill="#000000">LT-101</text>
  <line x1="880" y1="200" x2="902" y2="200" stroke="#000000" stroke-dasharray="2,2" stroke-width="1.5"/>
  
  <!-- Bottom Suction Line from V-101 to Pump P-101A/B -->
  <line x1="820" y1="240" x2="820" y2="360" stroke="#003366" stroke-width="4"/>
  <line x1="820" y1="360" x2="700" y2="360" stroke="#003366" stroke-width="4"/>
  
  <!-- Reflux Pump P-101A -->
  <circle cx="660" cy="360" r="28" fill="#cfe2ff" stroke="#000000" stroke-width="2.5"/>
  <polygon points="640,340 680,360 640,380" fill="#003366"/>
  <text x="635" y="410" font-family="Arial" font-size="12" font-weight="bold" fill="#000000">P-101A</text>
  
  <!-- Reflux Return Line back to Column -->
  <line x1="660" y1="332" x2="660" y2="220" stroke="#003366" stroke-width="3"/>
  <line x1="660" y1="220" x2="470" y2="220" stroke="#003366" stroke-width="3"/>
  <polygon points="470,220 480,215 480,225" fill="#003366"/>
  <text x="510" y="210" font-family="Arial" font-size="11" font-weight="bold" fill="#003366">REFLUX RETURN</text>
  
  <!-- Bottom Reboiler Loop on C-101 -->
  <line x1="410" y1="600" x2="410" y2="670" stroke="#003366" stroke-width="4"/>
  <line x1="410" y1="670" x2="220" y2="670" stroke="#003366" stroke-width="4"/>
  
  <!-- Reboiler E-102 -->
  <rect x="120" y="640" width="100" height="60" rx="10" fill="#f8d7da" stroke="#000000" stroke-width="2"/>
  <text x="145" y="675" font-family="Arial" font-size="13" font-weight="bold" fill="#000000">E-102</text>
  <text x="130" y="690" font-family="Arial" font-size="10" fill="#000000">REBOILER</text>
  
  <!-- Return Vapor from Reboiler -->
  <line x1="170" y1="640" x2="170" y2="550" stroke="#003366" stroke-width="3"/>
  <line x1="170" y1="550" x2="350" y2="550" stroke="#003366" stroke-width="3"/>
  
  <!-- Bottom Product Line -->
  <line x1="410" y1="670" x2="600" y2="670" stroke="#003366" stroke-width="4"/>
  <text x="460" y="660" font-family="Arial" font-size="11" font-weight="bold" fill="#003366">BOTTOMS TO STORAGE</text>
</svg>